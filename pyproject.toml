[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mtDNA"
version = "0.2.0"
description = "MTDNA raw data processing pipeline for GeneStory"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=24.1.0",
    "aiohttp>=3.11.18",
    "biopython>=1.85",
    "python-dotenv>=1.0.1",
    "google-api-python-client>=2.169.0",
    "gspread>=6.2.1",
    "ipykernel>=6.29.5",
    "loguru>=0.7.3",
    "matplotlib>=3.10.3",
    "oauth2client>=4.1.3",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "pydantic-settings>=2.13.1",
    "pytest>=9.0.2",
    "pyyaml>=6.0.2",
    "ruff>=0.15.4",
    "scipy>=1.16.0",
    "seaborn>=0.13.2",
    "tqdm>=4.66.0",
    "pydantic>=2.12.5",
    "python-lsp-server>=1.14.0",
    "vulture>=2.16",
    "basedpyright>=1.39.8",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",
    "COM812",   # missing trailing comma
    "COM819",   # prohibited trailing comma
    "S603",     # subprocess call - all executables validated via shutil.which()
    "PLR0913",  # too many arguments in function definition
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN001", "ANN201", "PLR2004", "SLF001", "N802"]

[tool.basedpyright]
pythonVersion = "3.12"
pythonPlatform = "All"
typeCheckingMode = "standard"

reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = true
reportUnusedClass = true
reportUnusedFunction = true
reportUnusedVariable = true
reportGeneralTypeIssues = true
reportOptionalMemberAccess = true
reportPrivateImportUsage = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
include = ["*"]
namespaces = false
